<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Library</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    /* Stile per il pulsante flottante in basso a destra */
    .btn-floating {
      width: 60px;
      height: 60px;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    /* Stile per i cuori (preferiti) */
    .favorite-icon {
      font-size: 1.2rem;
      color: #dc3545; /* Rosso Bootstrap */
      cursor: pointer;
    }
    
    /* Stile per le stelle */
    .star-rating {
      color: #ffc107; /* Giallo Bootstrap */
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="bi bi-film me-2"></i>Film Library
      </a>
      
      <form class="d-flex mx-auto w-50">
        <input class="form-control" type="search" placeholder="Search films..." aria-label="Search">
      </form>
      
      <div class="navbar-nav">
        <a class="nav-link" href="#">
          <i class="bi bi-person-circle fs-4 text-white"></i>
        </a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row flex-grow-1">
        <div id="films-filters" class="col-md-3 bg-light">
            <div class="py-4">
                <h5 class="mb-3">Filters</h5>
                <ul class="nav nav-pills flex-column gap-2 mb-auto">
                    <a href="#" class="list-group-item list-group-item-action active">All</a>
                    <a href="#" class="list-group-item list-group-item-action">Favorite</a>
                    <a href="#" class="list-group-item list-group-item-action">Best rated</a>
                    <a href="#" class="list-group-item list-group-item-action">Seen last month</a>
                    <a href="#" class="list-group-item list-group-item-action">Unseen</a>
                </ul>
            </div>
        </div>
      </aside>

      <main class="col-md-8">
        <h1 class="mb-4">All Films</h1>
        
        <ul class="list-group list-group-flush border">
          
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-bold col-4">Pulp Fiction</span>
            <span class="favorite-icon col-1 text-center">❤︎</span>
            <span class="text-muted col-3 text-center">March 10, 2026</span>
            <span class="star-rating col-3 text-end">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
            </span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-bold col-4">21 Grams</span>
            <span class="favorite-icon col-1 text-center">♡</span>
            <span class="text-muted col-3 text-center">March 17, 2026</span>
            <span class="star-rating col-3 text-end">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star"></i>
            </span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-bold col-4">Star Wars</span>
            <span class="favorite-icon col-1 text-center">♡</span>
            <span class="text-muted col-3 text-center"></span> <span class="star-rating col-3 text-end">
              <i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i>
            </span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-bold col-4">Matrix</span>
            <span class="favorite-icon col-1 text-center">❤︎</span>
            <span class="text-muted col-3 text-center">April 2, 2026</span>
            <span class="star-rating col-3 text-end">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
            </span>
          </li>

          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-bold col-4">Shrek</span>
            <span class="favorite-icon col-1 text-center">♡</span>
            <span class="text-muted col-3 text-center">March 21, 2026</span>
            <span class="star-rating col-3 text-end">
              <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star"></i><i class="bi bi-star"></i>
            </span>
          </li>

        </ul>
      </main>
      
    </div>
  </div>

  <button class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 shadow btn-floating" type="button" title="Add a new film">
    +
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
